[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# DISTRIBUTION name only; the IMPORT name stays `tokencount`.
# `tokencount` is not merely taken on PyPI -- it is REJECTED as "too similar to an existing
# project". PyPI collapses -, _ and . away before comparing, so `tokencount` and somebody else's
# `token-count` ("Count the number of tokens in a text string") normalize to the same key. An
# availability check that only asks for the exact name returns 404 and tells you nothing; this
# one was found by a canary upload, which is why the canary went first.
name = "tokencount-verify"
version = "0.1.0"
description = "A token count both parties can recompute. Refuses a claimed count that arithmetic rules out."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "tokencount contributors" }]
keywords = ["tokenizer", "bpe", "billing", "audit", "llm", "reproducibility"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Text Processing :: Linguistic",
  "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
tokencount = "tokencount.cli:main"

[project.urls]
Homepage = "https://github.com/nickharris808/tokencount"
Issues = "https://github.com/nickharris808/tokencount/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
